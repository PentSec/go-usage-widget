name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Logic and helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Logic tests (default timezone)
        run: node --test

      - name: Logic tests (America/New_York)
        run: node --test
        env:
          TZ: America/New_York

      - name: Logic tests (Asia/Tokyo)
        run: node --test
        env:
          TZ: Asia/Tokyo

      - name: Helper tests
        run: python3 -m unittest discover -s tests

      - name: Package metadata parses
        run: |
          python3 -c "import json; json.load(open('package/metadata.json'))"
          python3 -c "import xml.dom.minidom as m; m.parse('package/contents/config/main.xml')"
